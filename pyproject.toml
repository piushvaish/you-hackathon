[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "kojable-agent"
version = "0.1.0"
description = "Self-improving answer alignment agent with external GitHub memory"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai>=1.15.21,<1.16",
  # Daytona 0.199+ currently requires Pydantic 2.13+, while CrewAI 1.15
  # requires Pydantic <2.13. Version 0.198 has the documented SDK lifecycle.
  "daytona>=0.198,<0.199",
  "httpx>=0.27,<1",
  "pydantic>=2.11.9,<2.13",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
kojable = "kojable_agent.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
